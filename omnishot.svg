<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d2636"/>
      <stop offset="100%" stop-color="#0f141d"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3daee9"/>
      <stop offset="50%" stop-color="#1d6fa5"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#3daee9"/>
    </linearGradient>
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3daee9" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#2ecc71" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3daee9" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base App Card -->
  <rect x="12" y="12" width="104" height="104" rx="24" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#313d4f" stroke-width="2"/>

  <!-- Scroll Stream Indicator (The continuous scrolling capture ribbon) -->
  <path d="M 38 24 L 90 24 Q 96 24 96 30 L 96 98 Q 96 104 90 104 L 38 104 Q 32 104 32 98 L 32 30 Q 32 24 38 24 Z" fill="none" stroke="url(#scrollGrad)" stroke-width="3" stroke-dasharray="8 4"/>

  <!-- Camera Outer Ring -->
  <circle cx="64" cy="64" r="32" fill="#18202c" stroke="#3daee9" stroke-width="2.5"/>

  <!-- Camera Inner Aperture / Lens -->
  <circle cx="64" cy="64" r="22" fill="url(#lensGrad)"/>

  <!-- Lens Iris Highlight -->
  <path d="M 52 52 Q 64 44 76 52 Q 70 60 52 52 Z" fill="#ffffff" opacity="0.35"/>
  <circle cx="58" cy="56" r="4" fill="#ffffff" opacity="0.6"/>

  <!-- Top Reticle & Scroll Motion Arrows -->
  <polygon points="64,18 70,26 58,26" fill="#2ecc71"/>
  <polygon points="64,110 70,102 58,102" fill="#2ecc71"/>

  <!-- Corner Viewfinder Marks -->
  <path d="M 22 34 L 22 22 L 34 22" fill="none" stroke="#3daee9" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 106 34 L 106 22 L 94 22" fill="none" stroke="#3daee9" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 22 94 L 22 106 L 34 106" fill="none" stroke="#3daee9" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 106 94 L 106 106 L 94 106" fill="none" stroke="#3daee9" stroke-width="2.5" stroke-linecap="round"/>
</svg>
