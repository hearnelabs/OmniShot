<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="o1_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="o1_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="o1_lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#032b4d"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed outer neon halo & ring (fills 96% of tile, radius 60 out of 64) -->
  <circle cx="64" cy="64" r="60" fill="url(#o1_bg)" stroke="url(#o1_rim)" stroke-width="5"/>
  
  <!-- Outer Aperture Track -->
  <circle cx="64" cy="64" r="49" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 4"/>
  
  <!-- 6 Dynamic Iris Blades -->
  <g fill="none" stroke="url(#o1_rim)" stroke-width="3" stroke-linecap="round">
    <path d="M 64 15 C 84 22, 102 38, 106 64" />
    <path d="M 106 64 C 102 90, 84 106, 64 113" />
    <path d="M 64 113 C 44 106, 26 90, 22 64" />
    <path d="M 22 64 C 26 38, 44 22, 64 15" />
  </g>
  
  <!-- Center Optical Lens Element -->
  <circle cx="64" cy="64" r="32" fill="url(#o1_lens)" stroke="#00e676" stroke-width="3"/>
  <circle cx="64" cy="64" r="20" fill="#00f0ff" opacity="0.2"/>
  
  <!-- Optical Reflections / Flare -->
  <path d="M 46 50 Q 64 38 82 50 Q 72 64 46 50 Z" fill="#ffffff" opacity="0.55"/>
  <circle cx="54" cy="52" r="5.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="75" cy="75" r="3" fill="#00f0ff" opacity="0.9"/>
</svg>